<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubi Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .panel {
    background: #fff; padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); font-size: 13px; line-height: 1.5; min-width: 210px;
  }
  .panel h4 { margin: 0 0 6px; font-size: 14px; }
  .panel input[type=range] { width: 100%; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .line { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- File paths: put your exports in a "data" folder next to this file ----
const STATIONS_URL = "data/stations.geojson";
const LANES_URL    = "data/bike_lanes.geojson";

// ---- Base maps ----
const light = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
});
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});

const map = L.map("map", { layers: [light] }).setView([47.4979, 19.0402], 12);
const overlays = {};
L.control.layers({ "Light": light, "OSM": osm }, overlays, { collapsed: false }).addTo(map);

// ---- Helpers ----
function popupHtml(props) {
  const rows = Object.entries(props || {})
    .map(([k, v]) => `<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join("");
  return `<table>${rows}</table>`;
}

// Polygons/ways from Overpass "nwr" -> reduce to a single point
function toPoint(feature) {
  const g = feature.geometry;
  if (g.type === "Point") return [g.coordinates[1], g.coordinates[0]];
  const c = L.geoJSON(feature).getBounds().getCenter();
  return [c.lat, c.lng];
}

let stationPoints = [];
let coverageLayer = L.layerGroup();
let radius = 400;

function drawCoverage() {
  coverageLayer.clearLayers();
  stationPoints.forEach(p => L.circle(p, {
    radius, color: "#e67e22", weight: 1, fillColor: "#e67e22", fillOpacity: 0.12, interactive: false
  }).addTo(coverageLayer));
}

// ---- Load data ----
Promise.all([
  fetch(STATIONS_URL).then(r => r.json()),
  fetch(LANES_URL).then(r => r.json())
]).then(([stations, lanes]) => {

  // Bike lanes
  const laneLayer = L.geoJSON(lanes, {
    filter: f => f.geometry.type.includes("LineString"),
    style: f => f.properties.lane_class === "path"
      ? { color: "#16a085", weight: 2.5, opacity: 0.9 }
      : { color: "#8e44ad", weight: 2.5, opacity: 0.8, dashArray: "6 4" },
    onEachFeature: (f, l) => l.bindPopup(popupHtml(f.properties))
  }).addTo(map);

  // Stations (as points)
  const stationLayer = L.layerGroup();
  stations.features.forEach(f => {
    const p = toPoint(f);
    stationPoints.push(p);
    L.circleMarker(p, { radius: 5, color: "#fff", weight: 1, fillColor: "#2980b9", fillOpacity: 1 })
      .bindPopup(popupHtml(f.properties))
      .addTo(stationLayer);
  });
  stationLayer.addTo(map);

  drawCoverage();
  coverageLayer.addTo(map);

  // Layer toggles
  const lc = L.control.layers(null, {
    "Bike lanes (OSM)": laneLayer,
    "Stations": stationLayer,
    "Walking coverage": coverageLayer
  }, { collapsed: false, position: "topright" }).addTo(map);

  // Info + slider panel
  const panel = L.control({ position: "bottomleft" });
  panel.onAdd = () => {
    const d = L.DomUtil.create("div", "panel");
    d.innerHTML = `
      <h4>Bubi Explorer</h4>
      <div><span class="swatch" style="background:#2980b9"></span>Stations: <b>${stationPoints.length}</b></div>
      <div><span class="line" style="background:#16a085"></span>Separate cycleways: <b>${lanes.features.filter(f=>f.properties.lane_class==="path").length}</b></div>
      <div><span class="line" style="background:#8e44ad"></span>Lanes/tracks on roads: <b>${lanes.features.filter(f=>f.properties.lane_class==="lane").length}</b></div>
      <hr>
      Walking distance: <b id="rv">${radius}</b> m
      <input id="r" type="range" min="200" max="600" step="50" value="${radius}">`;
    L.DomEvent.disableClickPropagation(d);
    d.querySelector("#r").addEventListener("input", e => {
      radius = +e.target.value;
      d.querySelector("#rv").textContent = radius;
      drawCoverage();
    });
    return d;
  };
  panel.addTo(map);

  const b = laneLayer.getBounds();
  if (b.isValid()) map.fitBounds(b);
}).catch(err => {
  document.body.insertAdjacentHTML("afterbegin",
    `<pre style="position:absolute;z-index:9999;background:#fee;padding:8px">Load error: ${err}\nOpen via a local server (see README), not by double-clicking the file.</pre>`);
});
</script>
</body>
</html>
